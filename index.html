<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>チーム開発練習アプリ</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 24px;
        line-height: 1.6;
      }
      header {
        background: #334155;
        color: white;
        padding: 16px;
        border-radius: 8px;
      }
      .members {
        display: grid;
        gap: 16px;
        margin-top: 20px;
      }
      .card {
        border: 1px solid #cbd5e1;
        padding: 16px;
        border-radius: 8px;
        background: #f8fafc;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>チーム開発練習プロジェクト</h1>
    </header>

    <main>
      <h2>メンバー紹介</h2>
      <div class="members">
        <div class="card">
          <h3>Aさん (リーダー)</h3>
          <p>役割: リポジトリ管理 / 意気込み: 安全なチーム開発を目指します！</p>
        </div>
      </div>
    </main>
  </body>
</html>
